<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой проект</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px 16px 16px;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.5rem;
    }
    #limit-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      z-index: 10;
    }
    #limit-fill {
      height: 100%;
      width: 0;
      background: #4caf50;
      transition: width 0.2s, background 0.2s;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
      padding: 8px;
    }
    #counter {
      font-size: 0.9rem;
      color: #555;
      margin-top: 4px;
    }
    button {
      margin-top: 8px;
      padding: 8px 16px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div id="limit-bar"><div id="limit-fill"></div></div>

  <h1>Привет! Мои заметки</h1>

  <textarea id="text" rows="4" placeholder="Введите заметку..."></textarea>
  <div id="counter">0 / 200</div>
  <button id="add">Добавить</button>
  <button id="clear">Очистить</button>
  <ul id="list"></ul>

  <script>
    const LIMIT = 200;
    const text = document.getElementById('text');
    const fill = document.getElementById('limit-fill');
    const counter = document.getElementById('counter');

    function update() {
      if (text.value.length > LIMIT) {
        text.value = text.value.slice(0, LIMIT);
      }
      const len = text.value.length;
      const pct = (len / LIMIT) * 100;
      fill.style.width = pct + '%';
      fill.style.background = pct < 70 ? '#4caf50' : pct < 90 ? '#ffc107' : '#f44336';
      counter.textContent = len + ' / ' + LIMIT;
    }

    text.addEventListener('input', update);
    document.getElementById('clear').addEventListener('click', () => {
      text.value = '';
      update();
    });
    update();

    const list = document.getElementById('list');
    let notes = JSON.parse(localStorage.getItem('notes') || '[]');
    function render() {
      list.innerHTML = '';
      notes.forEach((n, i) => {
        const li = document.createElement('li');
        li.textContent = n + ' ';
        const b = document.createElement('button');
        b.textContent = '✕';
        b.onclick = () => { notes.splice(i, 1); save(); };
        li.appendChild(b);
        list.appendChild(li);
      });
    }
    function save() {
      localStorage.setItem('notes', JSON.stringify(notes));
      render();
    }
    document.getElementById('add').addEventListener('click', () => {
      const v = text.value.trim();
      if (!v) return;
      notes.unshift(v);
      text.value = '';
      update();
      save();
    });
    render();
  </script>
</body>
</html>
